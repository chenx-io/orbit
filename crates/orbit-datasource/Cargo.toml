[package]
name = "orbit-datasource"
version.workspace = true
license.workspace = true
edition = "2021"
repository = "https://github.com/chenx-io/orbit"
description = "DataSource connection management & read-only query executor (SQLite/PostgreSQL/MySQL/Redis)"

[dependencies]
orbit-config = { path = "../orbit-config" }
orbit-assertion = { path = "../orbit-assertion" }
async-trait.workspace = true
# Unify features across workspaces (root workspace / web/src-tauri standalone workspace) to avoid inheritance ambiguity
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "any",
    "sqlite",
    "postgres",
    "mysql",
    "migrate",
    "macros",
] }
redis = { version = "0.28", default-features = false, features = [
    "tokio-comp",
    "connection-manager",
] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "sync"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "macros", "rt"] }
