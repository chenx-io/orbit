syntax = "proto3";

package orbit.distributed;

// ── base messages ─────────────────────────────────────────

enum AgentState {
  IDLE = 0;       // idle
  RUNNING = 1;    // running (a task is executing)
  PAUSED = 2;     // paused (no longer accepts new tasks)
  OFFLINE = 3;    // offline (heartbeat timeout / connection lost)
}

message Label {
  string key = 1;
  string value = 2;
}

message RegisterRequest {
  string agent_id = 1;
  string mode = 2;          // "server" | "client"
  string addr = 3;          // server mode: agent listening address
  string version = 4;
  uint32 cpu_cores = 5;
  uint64 memory_mb = 6;
  repeated Label labels = 7;
}

message RegisterResponse {
  bool accepted = 1;
  string agent_id = 2;
  string reason = 3;
  bool claimed = 4;        // whether another controller is already attached (server mode)
  uint64 epoch = 5;        // epoch of this attachment (carried on later controller Pings to determine ownership)
}

message PingRequest {
  string agent_id = 1;
  uint64 epoch = 2;        // attachment epoch held by the controller
  string token = 3;        // controller-specific token (unique owner after takeover)
}

message PingResponse {
  string agent_id = 1;
  int64 server_time_ms = 2;
  bool is_owner = 3;       // whether this controller is still the current owner
}

// single-request execution (any request may be sent to an agent for execution)
message ExecuteRequestPayload {
  string method = 1;
  string url = 2;
  map<string, string> headers = 3;
  string body = 4;
  string protocol = 5;      // defaults to http
  string request_format = 6;
  string response_format = 7;
  string prereq_script = 8;  // pre-script (same as local execution)
  string postreq_script = 9; // post-script (same as local execution)
  map<string, string> env_vars = 10; // script environment variables
}

message ExecuteResponse {
  int32 status = 1;
  map<string, string> headers = 2;
  string body = 3;
  int64 duration_ms = 4;
  string error = 5;
  ExecuteTimings timing = 6;   // per-phase timings (same as local execution)
  repeated ScriptLogEntry pre_logs = 7;
  repeated ScriptLogEntry post_logs = 8;
  string decoded = 9;          // post-script pm.response.decoded
  repeated TestResultEntry post_tests = 10; // post-script pm.test assertions
}

message ScriptLogEntry {
  string level = 1;
  string message = 2;
}

message TestResultEntry {
  string name = 1;
  bool passed = 2;
  string message = 3;
}

message ExecuteTimings {
  double dns_ms = 1;
  double tcp_ms = 2;
  double tls_ms = 3;
  double ttfb_ms = 4;
  double download_ms = 5;
  double total_ms = 6;
}

// task command (controller → agent)
message TaskCommand {
  string task_id = 1;
  string action = 2;        // start | stop | pause | resume
  string plan_yaml = 3;     // partitioned TestPlan (executed locally by the agent)
  double vu_fraction = 4;
  ExecuteRequestPayload execute = 5;  // single request carried when action=execute
}

// task event (agent → controller; over the AssignTask stream in server mode)
message AgentEvent {
  string agent_id = 1;
  string task_id = 2;
  string type = 3;          // started | finished | failed | progress | status_change
  string message = 4;
  AgentState state = 5;
  AgentMetricsSnapshot metrics = 6;
  ResourceSnapshot resource = 7;
  ExecuteResponse execute_result = 8; // returned when type=execute_result
}

// system resource snapshot (collected via sysinfo)
message ResourceSnapshot {
  double cpu_percent = 1;
  double mem_used_mb = 2;
  double mem_total_mb = 3;
  double mem_percent = 4;
  double load_avg_1m = 5;
  int64 timestamp_ms = 6;
}

// fallback summary statistics (corresponds to AgentMetricsSnapshot.summary)
message MetricsSummary {
  double p50_ms = 1;
  double p90_ms = 2;
  double p95_ms = 3;
  double p99_ms = 4;
  double mean_ms = 5;
  double rps = 6;
  double error_rate = 7;
}

// load metrics snapshot reported by an agent
message AgentMetricsSnapshot {
  string agent_id = 1;
  uint64 timestamp_ms = 2;
  uint32 active_vus = 3;
  uint64 total_requests = 4;
  uint64 total_errors = 5;
  // HDR histogram encoding (base64), used for exact percentile merging on the controller
  string hdr_histogram_b64 = 6;
  MetricsSummary summary = 7;
}

// ── mode A: the agent is the gRPC server, the controller connects to it ──
service AgentService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc AssignTask(stream TaskCommand) returns (stream AgentEvent);
  rpc Ping(PingRequest) returns (PingResponse);
}

// ── mode B: the controller is the gRPC server, the agent connects to it ──
service ControllerService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // same message set as server mode, only the bidi direction is swapped
  rpc AssignTask(stream AgentEvent) returns (stream TaskCommand);
  rpc Ping(PingRequest) returns (PingResponse);
}
