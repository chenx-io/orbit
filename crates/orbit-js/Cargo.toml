[package]
name = "orbit-js"
version.workspace = true
license.workspace = true
edition = "2021"
repository = "https://github.com/chenx-io/orbit"
description = "QuickJS runtime for Orbit — pre/post request scripts"

[dependencies]
rquickjs = { version = "0.12", features = ["parallel"] }
tokio.workspace = true
md5 = { package = "md-5", version = "0.10" }
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
ripemd = "0.1"
hmac = "0.12"
base64 = "0.22"
aes = "0.8"
des = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ecb = "0.1"
cipher = "0.4"
uuid = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
