[package]
name = "orbit-engine"
version.workspace = true
license.workspace = true
edition = "2021"
repository = "https://github.com/chenx-io/orbit"
description = "Core engine for Orbit — scheduler, flow runner, metrics bus"

[dependencies]
orbit-protocol = { path = "../orbit-protocol" }
orbit-codec = { path = "../orbit-codec" }
orbit-assertion = { path = "../orbit-assertion" }
orbit-extractor = { path = "../orbit-extractor" }
orbit-config = { path = "../orbit-config" }
orbit-metrics = { path = "../orbit-metrics" }
orbit-js = { path = "../orbit-js" }

tokio = { workspace = true, features = ["sync", "time", "macros"] }
tokio-util.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
serde.workspace = true
url.workspace = true
csv = "1.3"
jiff.workspace = true
base64.workspace = true

[dev-dependencies]
axum.workspace = true
jiff.workspace = true
tokio = { workspace = true, features = ["full"] }
