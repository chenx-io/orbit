[package]
name = "pg-native"
version = "1.0.0"
edition = "2021"
description = "Orbit 动态库协议插件示例：PostgreSQL（用 sqlx 自带连接池）"
repository = "https://github.com/chenx-io/orbit"

# 动态库插件：编译为宿主平台 cdylib，由宿主 dlopen 加载（非 wasm）
[lib]
crate-type = ["cdylib"]

[dependencies]
orbit-plugin-api-native = { path = "../../../crates/orbit-plugin-api-native" }
serde_json = "1"
base64 = "0.22"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "postgres", "chrono"] }
chrono = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[workspace]
