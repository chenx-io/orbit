[package]
name = "pg-query"
version = "1.0.0"
edition = "2021"
description = "Orbit 协议插件：PostgreSQL 查询（PG wire 握手 + SCRAM 认证 + 查询）"
repository = "https://github.com/chenx-io/orbit"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.30"
serde_json = "1"
md-5 = "0.10"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
rand = "0.8"
base64 = "0.22"

# 示例插件默认不参与 workspace 构建（需 wasm32-wasip2 target）
[workspace]
