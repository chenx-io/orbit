[workspace]
resolver = "2"
members = [
    "crates/orbit-*",
]
exclude = ["web/src-tauri"]

# Single version source: every crate inherits via version.workspace = true, so releases only change this line
[workspace.package]
version = "0.1.0"
license = "AGPL-3.0-or-later"
description = "Orbit — All-in-one open-source API testing toolkit"
repository = "https://github.com/chenx-io/orbit"
homepage = "https://github.com/chenx-io/orbit"
readme = "README.md"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# HTTP stack
hyper = "1"
hyper-util = "0.1"
http-body-util = "0.1"
http = "1"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "0.26"

# gRPC (Phase 2)
tonic = "0.14"
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
quick-xml = { version = "0.37", features = ["serialize"] }

# JS runtime
rquickjs = { version = "0.12", features = ["full"] }

# Metrics
hdrhistogram = { version = "7", features = ["serialization"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Web server
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

# Storage
rusqlite = { version = "0.31", features = ["bundled"] }
# Database / cache clients (shared drivers: the target databases used by orbit-datasource)
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "any",
    "sqlite",
    "postgres",
    "mysql",
    "migrate",
    "macros",
] }
redis = { version = "0.28", default-features = false, features = [
    "tokio-comp",
    "connection-manager",
] }

# WASM runtime
wasmtime = { version = "46", features = ["component-model", "async"] }

# Proto compilation: vendored protoc (used by the prost/tonic build.rs),
# so CI on all three platforms and local builds need no protoc installed, with a locked consistent version
protoc-bin-vendored = "3"

# Native (dynamic library) plugins
abi_stable = { version = "0.11" }
libloading = "0.8"

# Archive
zip = { version = "2", default-features = false, features = ["deflate"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Async traits
async-trait = "0.1"

# Utilities
bytes = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
jiff = { version = "0.2", features = ["serde"] }
regex = "1"
jmespath = "0.5"
base64 = { version = "0.22", features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

# Must be **character-for-character identical** to [profile.release] in web/src-tauri/Cargo.toml: in CI the CLI and the desktop app
# are merged into one job sharing a single target directory, so a different profile means different fingerprints, a duplicate build of shared dependencies,
# and the merge was pointless (see the header of .github/workflows/release.yml).
# See web/src-tauri/Cargo.toml for the rationale behind lto = false.
[profile.release]
opt-level = 3
lto = false
strip = "symbols"

[profile.dev]
opt-level = 1
