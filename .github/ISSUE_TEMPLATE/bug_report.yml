name: Bug Report
description: 报告一个 bug
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请清晰描述遇到的问题
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: e.g. 0.1.0
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
  - type: textarea
    id: context
    attributes:
      label: 环境信息
      placeholder: OS / Rust / Node 版本等
