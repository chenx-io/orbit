name: Feature Request
description: 建议一个新功能
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 相关痛点
      description: 该功能要解决什么问题？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你期望的行为或方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
  - type: textarea
    id: context
    attributes:
      label: 其他上下文
